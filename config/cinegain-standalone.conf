# Standalone PipeWire instance config for Cinegain filter chain
context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
      args = {
          node.description = "Cinegain (Filmton Dialog & Dynamik)"
          media.name       = "Cinegain Sink"
          filter.graph = {
              nodes = [
                  {
                      type   = ladspa
                      name   = cinegain
                      plugin = "/home/tobias/agent/projects/cinegain/code/v1/src/cinegain.so"
                      label  = cinegain
                      control = {
                          "bypass"           = 0.0
                          "input_db"         = 0.0
                          "highpass_hz"      = 10.0
                          "bass_db"          = 0.0
                          "dialog_db"        = 0.0
                          "dialog_hz"        = 2500.0
                          "dialog_q"         = 1.0
                          "treble_db"        = 0.0
                          "mid_db"           = 0.0
                          "side_db"          = 0.0
                          "leveler"          = 0.0
                          "lev_target_db"    = -18.0
                          "lev_max_boost_db" = 0.0
                          "lev_max_cut_db"   = 0.0
                          "lev_speed_s"      = 2.0
                          "lev_gate_db"      = -55.0
                          "comp_thresh_db"   = 0.0
                          "comp_ratio"       = 1.0
                          "comp_knee_db"     = 0.0
                          "comp_attack_ms"   = 20.0
                          "comp_release_ms"  = 250.0
                          "makeup_db"        = 0.0
                          "lim_ceiling_db"   = -0.2
                          "lim_release_ms"   = 80.0
                      }
                  }
              ]
              inputs  = [ "cinegain:In L" "cinegain:In R" ]
              outputs = [ "cinegain:Out L" "cinegain:Out R" ]
          }
          capture.props = {
              media.class        = Audio/Sink
              node.name          = "cinegain_sink"
              node.description   = "Cinegain (Filmton Dialog & Dynamik)"
              audio.position     = [ FL FR ]
              priority.driver    = 500
              priority.session   = 500
          }
          playback.props = {
              node.name          = "cinegain_output"
              node.passive       = true
              node.dont-Move     = true
              audio.position     = [ FL FR ]
          }
      }
    }
]
