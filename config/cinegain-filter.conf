# Cinegain PipeWire Filter-Chain Configuration
# Erstellt eine virtuelle Audio-Senke "Cinegain (Filmton Dialog & Dynamik)"
# Alle Audiostreams, die hierhin geleitet werden, durchlaufen das cinegain LADSPA-Plugin.

context.modules = [
    { name = libpipewire-module-filter-chain
      args = {
          node.description = "Cinegain (Filmton Dialog & Dynamik)"
          media.name       = "Cinegain Sink"
          filter.graph = {
              nodes = [
                  {
                      type   = ladspa
                      name   = cinegain
                      plugin = "/home/tobias/agent/projects/cinegain/code/v1/src/cinegain.so"
                      label  = cinegain
                      control = {
                          "bypass"           = 0.0
                          "input_db"         = 8.0
                          "highpass_hz"      = 40.0
                          "bass_db"          = -3.0
                          "dialog_db"        = 6.5
                          "dialog_hz"        = 2500.0
                          "dialog_q"         = 1.0
                          "treble_db"        = 1.5
                          "mid_db"           = 2.0
                          "side_db"          = -3.0
                          "leveler"          = 1.0
                          "lev_target_db"    = -16.0
                          "lev_max_boost_db" = 15.0
                          "lev_max_cut_db"   = 6.0
                          "lev_speed_s"      = 1.5
                          "lev_gate_db"      = -55.0
                          "comp_thresh_db"   = -12.0
                          "comp_ratio"       = 3.5
                          "comp_knee_db"     = 6.0
                          "comp_attack_ms"   = 10.0
                          "comp_release_ms"  = 180.0
                          "makeup_db"        = 2.0
                          "lim_ceiling_db"   = -0.5
                          "lim_release_ms"   = 70.0
                      }
                  }
              ]
              inputs  = [ "cinegain:In L" "cinegain:In R" ]
              outputs = [ "cinegain:Out L" "cinegain:Out R" ]
          }
          capture.props = {
              media.class        = Audio/Sink
              node.name          = "cinegain_sink"
              node.description   = "Cinegain (Filmton Dialog & Dynamik)"
              audio.position     = [ FL FR ]
              priority.driver    = 500
              priority.session   = 500
          }
          playback.props = {
              node.name          = "cinegain_output"
              node.passive       = true
              node.dont-Move     = true
              audio.position     = [ FL FR ]
          }
      }
    }
]
